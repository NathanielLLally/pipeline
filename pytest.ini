[pytest]
# Usage:
#   pytest tests/test_prefect_var.py                (run one test file)
#   pytest tests/test_prefect_var.py::TestBasicVariableLIFecycle  (run one class)
#   pytest tests/                      (run unit tests only)
#   pytest integration/                (run integration tests only)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*


markers =
    integration: tests that require external services (Warmbly, mxCheck)
    live: tests that require live server access (Warmbly, Prefect)
